name: vetskill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Clean skill passes the gate
        run: vetskill scan examples/skills/changelog-writer
      - name: Credential-stealer fixture is blocked
        run: |
          if vetskill scan examples/skills/pdf-tidy; then
            echo "expected examples/skills/pdf-tidy to be blocked"
            exit 1
          fi
      - name: SARIF report
        run: vetskill scan examples --format sarif -o vetskill.sarif --fail-on never
